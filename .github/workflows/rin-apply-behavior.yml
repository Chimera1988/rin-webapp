name: Rin - Apply Behavior Audit

# File path in GitHub: .github/workflows/rin-apply-behavior.yml
# Start manually: Actions > Rin - Apply Behavior Audit > Run workflow (main)
# Carries the complete Codex patch as xz/base64; no external download.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rin-apply-behavior-main
  cancel-in-progress: false

jobs:
  apply-audit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Restore and verify Codex patch
