      - name: Validate base revision and apply changes
        id: apply
        shell: bash
        env:
          PATCH_FILE: ${{ steps.restore.outputs.patch_file }}
        run: |
          set -euo pipefail
          BASE='ee9e8caea39be3be5f72b45b0e65162e9ace4659'
          WORKFLOW='.github/workflows/rin-apply-behavior.yml'
          git cat-file -e "${BASE}^{commit}"

          # Idempotent if the very same patch is already present.
          if git apply --reverse --check "$PATCH_FILE"; then
            echo 'Patch already applied: no new commit is needed.'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git merge-base --is-ancestor "$BASE" HEAD; then
            echo 'ERROR: main does not contain the source revision.' >&2
            exit 1
          fi

          # Refuse to overwrite ANY later source changes.
          unexpected="$(git diff --name-only "$BASE" HEAD | grep -Fxv "$WORKFLOW" || true)"
          if [ -n "$unexpected" ]; then
            echo 'ERROR: main has changed after the audit; stop for manual review:' >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi

          git apply --check "$PATCH_FILE"
          git apply "$PATCH_FILE"
          git diff --check
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          echo 'Patch applied cleanly; tests will run before committing.'

      - name: Set up Node.js 24
        if: steps.apply.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run complete offline checks
        if: steps.apply.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          node scripts/check-syntax.js
          node scripts/rin-behavior-audit.mjs "$RUNNER_TEMP/rin-audit-validation.json"
          git diff --check
          echo 'All automated offline checks passed.'
          echo 'NOTE: Live OpenAI dialogue and browser integration are NOT tested here.'
          echo 'NOTE: Build smoke remains blocked if public/avatar.jpg is absent.'

      - name: Commit audited files and update main
        if: steps.apply.outputs.changed == 'true'
        shell: bash
        env:
          PATCH_FILE: ${{ steps.restore.outputs.patch_file }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Stage only paths from the verified patch, not generated temporary files.
          mapfile -t paths < <(git apply --numstat "$PATCH_FILE" | cut -f3)
          if [ "${#paths[@]}" -eq 0 ]; then
            echo 'ERROR: no paths in patch.' >&2
            exit 1
          fi
          git add -- "${paths[@]}"
          git diff --cached --check
          git commit -m 'Improve Rin personality, memory and dialogue behavior'
          git push origin HEAD:main
          echo 'SUCCESS: audited changes committed and pushed to main.'
