name: Rin - Dialogue and Memory Guardrails FIX

on:
  push:
    paths:
      - '.github/workflows/Rin-Dialogue-Guardrails-FIX.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rin-dialogue-guardrails-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out latest Rin source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Add regression tests (without committing yet)
        shell: bash
        run: |
          mkdir -p tests
          cat > tests/rin-dialogue-guardrails.test.js <<'RIN_REGRESSION_TESTS'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import { buildBehaviorState } from '../lib/cognition/behavior-state.js';
          import { normalizeTurnDecision } from '../lib/cognition/turn-decision.js';
          import { stabilizeTurn } from '../lib/cognition/turn-stabilizer.js';

          const evt = (role, content, n) => ({
            role, content, kind: 'text', status: 'complete',
            id: `${role}-${n}`, requestId: `request-${n}`, ts: 1794632400000 + n * 1000
          });
          const completedProject = [
            evt('user', 'Я его закончил)', 1),
            evt('assistant', 'Отлично, проект завершён.', 2)
          ];

          function outputFor(userText, response, history = []) {
            const behaviorState = buildBehaviorState({ userText, history });
            const decision = normalizeTurnDecision({
              act: 'answer_directly', focus: 'ответ', stance: 'спокойно',
              question: { mode: 'none', reason: null },
              replyLink: { targetEventId: null, reason: null },
              delivery: { mode: 'single_text', responseDepth: 'short',
                segments: [{ type: 'text', purpose: 'reply', stickerIntent: null, maxChars: 300 }] },
              intentTransition: { operation: 'none' },
              openLoops: { open: [], resolveIds: [] }, realityMode: 'grounded'
            });
            const result = stabilizeTurn({ decision, behaviorState,
              realization: { segments: [{ text: response }] }
            });
            return result.realization.segments.map(x => x.text).join(' ');
          }

          test('closed project remains closed during a directly related follow-up', () => {
            const state = buildBehaviorState({
              userText: 'Ооо, я так целую неделю работал 😅', history: completedProject
            });
            assert.equal(state.topicProgress.completed, true);
          });

          test('explicitly unfinished work is never marked finished', () => {
            assert.equal(buildBehaviorState({userText:'Я не закончил проект',history:completedProject}).topicProgress.completed, false);
          });

          test('a new project is not confused with a completed old one', () => {
            const state = buildBehaviorState({
              userText: 'А теперь начал новый проект', history: completedProject
            });
            assert.equal(state.topicProgress.completed, false);
          });

          test('an unrelated subject does not inherit completion', () => {
            const state = buildBehaviorState({
              userText: 'Хочу посмотреть новый фильм', history: completedProject
            });
            assert.equal(state.topicProgress.completed, false);
          });

          test('old completion is not carried beyond a short related window', () => {
            const history = [...completedProject,
              evt('user', 'Какая сегодня погода?', 3), evt('assistant', 'Облачно.', 4),
              evt('user', 'Какое кино посмотреть?', 5), evt('assistant', 'Комедию.', 6),
              evt('user', 'Посоветуй книгу', 7), evt('assistant', 'Рассказы.', 8)
            ];
            assert.equal(buildBehaviorState({userText:'Сегодня работал',history}).topicProgress.completed, false);
          });

          test('explicit question boundary strips the question but keeps a statement', () => {
            const answer = outputFor('Не задавай мне вопросов', 'Я рядом. Что тебя сегодня радует?');
            assert.equal(answer, 'Я рядом.');
          });

          test('question boundary preserves statements surrounding a stray question', () => {
            const answer = outputFor('Без вопросов', 'Я тут. Что нового? Можем просто поговорить.');
            assert.equal(answer, 'Я тут. Можем просто поговорить.');
          });

          test('question-only reply gets a harmless short fallback at strong boundary', () => {
            const answer = outputFor('Не задавай мне вопросов', 'Как день?');
            assert.equal(answer, 'Я тебя услышала.');
          });

          test('without a question boundary Rin may still ask naturally', () => {
            const answer = outputFor('Как дела?', 'Хорошо. А у тебя?');
            assert.equal(answer, 'Хорошо. А у тебя?');
          });
          RIN_REGRESSION_TESTS
          node --check tests/rin-dialogue-guardrails.test.js
      - name: Confirm regression on unpatched code (RED)
        shell: bash
        run: |
          if grep -q 'function relatedRecentCompletion(' lib/cognition/behavior-state.js; then
            echo 'Existing patch detected; skipping expected failing baseline.'
          else
            set +e
            node --test --test-reporter=tap tests/rin-dialogue-guardrails.test.js > /tmp/rin-red.txt 2>&1
            result=$?
            set -e
            cat /tmp/rin-red.txt
            if [ "$result" -eq 0 ] || ! grep -Eq '^# fail [1-9][0-9]*$' /tmp/rin-red.txt; then
              echo 'Expected behavioral regression was not reproduced; stopping for safety.' >&2
              exit 1
            fi
            echo 'RED: tests reproduced the original behavior gaps.'
          fi
      - name: Apply two narrow code fixes
        shell: bash
        run: |
          python3 - <<'RIN_SAFE_PATCH'
          from pathlib import Path
          import re

          behavior_path = Path('lib/cognition/behavior-state.js')
          stabilizer_path = Path('lib/cognition/turn-stabilizer.js')

          behavior = behavior_path.read_text(encoding='utf-8')
          if 'function relatedRecentCompletion(' not in behavior:
              function_head = "function topicProgressSnapshot(userText = '', history = []) {"
              if behavior.count(function_head) != 1:
                  raise RuntimeError('Cannot uniquely locate topicProgressSnapshot; aborting without writes')
              after = behavior.index(function_head)
              old_match = re.search(r'(?m)^  const completed = (.+)\n    && !(.+);\n', behavior[after:after + 2400])
              if old_match is None or not all(x.endswith('.test(text)') for x in old_match.groups()):
                  raise RuntimeError('Completion logic changed upstream; refusing an unsafe patch')
              finish_re = old_match.group(1)[:-len('.test(text)')]
              negation_re = old_match.group(2)[:-len('.test(text)')]
              new_helpers = r'''// A short-lived topic fact, derived from real user history, not a second intent.
          // It must not attach a completed project to a different/new task.
          const RECENT_TASK_DONE_RE = __FINISH_RE__;
          const RECENT_TASK_NOT_DONE_RE = __NEGATION_RE__;
          const RECENT_TASK_FOLLOWUP_RE = /(?:^|[^\p{L}])(?:проект|работ|задач|додел|заверш|закончил|недел|пахал|трудил)/iu;
          const NEW_OR_OPEN_TASK_RE = /(?:^|[^\p{L}])(?:(?:нов(?:ый|ая|ое|ую)|друг(?:ой|ая|ое|ую)|следующ(?:ий|ая|ую))\s+(?:проект|работ|задач)[\p{L}]*|(?:начал|начала|начали|начинаю|приступил)\s+(?:(?:новый|новую|другой|другую)\s+)?(?:проект|работ|задач)[\p{L}]*|(?:надо|нужно|предстоит)\s+(?:ещ[её]\s+)?(?:делать|сделать|завершить|доделать)|(?:не|пока\s+не|ещ[её]\s+не)\s+(?:закончил|завершил|доделал))(?:$|[^\p{L}])/iu;

          function explicitlyCompletedTask(value = '') {
            const text = clean(value, 1200);
            return RECENT_TASK_DONE_RE.test(text) && !RECENT_TASK_NOT_DONE_RE.test(text);
          }

          function relatedRecentCompletion(text = '', history = []) {
            if (!RECENT_TASK_FOLLOWUP_RE.test(text) || NEW_OR_OPEN_TASK_RE.test(text) || RECENT_TASK_NOT_DONE_RE.test(text)) return false;
            const recentUserTurns = (Array.isArray(history) ? history : [])
              .filter(item => item?.role === 'user' && item?.content)
              .slice(-3);
            // A newly opened task is a topic boundary. Only a preceding explicit
            // completion, within three user turns, may be carried into the follow-up.
            for (let index = recentUserTurns.length - 1; index >= 0; index -= 1) {
              const prior = String(recentUserTurns[index].content || '');
              if (NEW_OR_OPEN_TASK_RE.test(prior) || RECENT_TASK_NOT_DONE_RE.test(prior)) return false;
              if (explicitlyCompletedTask(prior)) return true;
              if (!RECENT_TASK_FOLLOWUP_RE.test(prior) &&
                  !/^(?:да|ага|угу|хорошо|ладно|ок|окей|понятно)[.!… )]*$/iu.test(prior.trim())) return false;
            }
            return false;
          }

          '''.replace('__FINISH_RE__', finish_re).replace('__NEGATION_RE__', negation_re)
              if 'RECENT_TASK_DONE_RE' in behavior:
                  raise RuntimeError('Partial patch found in behavior-state.js; stopping')
              behavior = behavior.replace(function_head, new_helpers + function_head, 1)
              if behavior.count(old_match.group(0)) != 1:
                  raise RuntimeError('Completion source has changed; cannot replace safely')
              behavior = behavior.replace(old_match.group(0),
                  '  const completed = explicitlyCompletedTask(text) || relatedRecentCompletion(text, history);\n', 1)
              behavior_path.write_text(behavior, encoding='utf-8')

          stabilizer = stabilizer_path.read_text(encoding='utf-8')
          if 'function removeQuestionSentences(' not in stabilizer:
              anchor = 'function duplicateKey(value = \'\') {'
              if stabilizer.count(anchor) != 1:
                  raise RuntimeError('Stabilizer helper insertion point changed')
              helper = r'''// Only used when the user explicitly forbids questions. Keep statements
          // around a stray question instead of suppressing the entire response.
          function removeQuestionSentences(text = '') {
            const source = String(text || '');
            if (!source.includes('?')) return source;
            return (source.match(/[^.!?…]*[.!?…]+|[^.!?…]+$/gu) || [])
              .filter(sentence => !sentence.includes('?'))
              .join('')
              .replace(/\s+/gu, ' ')
              .trim();
          }

          '''
              stabilizer = stabilizer.replace(anchor, helper + anchor, 1)
              needle = '''  nextRealizationSegments.push(...depthFit.segments);

            let decisionInput = {'''
              if stabilizer.count(needle) != 1:
                  raise RuntimeError('Stabilizer realization insertion point changed')
              replacement = '''  nextRealizationSegments.push(...depthFit.segments);

            // An explicit no-question boundary must constrain the delivered words too,
            // not merely decision.question.mode. Never add an LLM retry for this.
            if (behaviorState?.question?.strongNoQuestion) {
              for (const segment of nextRealizationSegments) {
                if (!String(segment?.text || '').includes('?')) continue;
                segment.text = removeQuestionSentences(segment.text) || 'Я тебя услышала.';
                warnings.push('explicit_no_question_guard_applied');
              }
            }

            let decisionInput = {'''
              stabilizer = stabilizer.replace(needle, replacement, 1)
              original_fallback = "    const text = fitMessengerText(stripMessengerAsteriskMarkup(repairMaleUserAddress(fallbackText)), 320) || 'Я тебя услышала.';"
              if stabilizer.count(original_fallback) != 1:
                  raise RuntimeError('Fallback implementation changed upstream; stopping')
              guarded_fallback = """    const rawFallback = fitMessengerText(stripMessengerAsteriskMarkup(repairMaleUserAddress(fallbackText)), 320) || 'Я тебя услышала.';
              const text = behaviorState?.question?.strongNoQuestion
                ? removeQuestionSentences(rawFallback) || 'Я тебя услышала.'
                : rawFallback;"""
              stabilizer = stabilizer.replace(original_fallback, guarded_fallback, 1)
              stabilizer_path.write_text(stabilizer, encoding='utf-8')
          else:
              if 'explicit_no_question_guard_applied' not in stabilizer:
                  raise RuntimeError('Partial stabilizer patch found; stopping')

          print('Rin guardrail patches applied or already present')
          RIN_SAFE_PATCH
          node --check lib/cognition/behavior-state.js
          node --check lib/cognition/turn-stabilizer.js
      - name: Verify targeted behavior (GREEN)
        run: node --test --test-reporter=tap tests/rin-dialogue-guardrails.test.js
      - name: Verify all existing offline checks
        run: npm run check
      - name: Commit only tested source and regression tests
        shell: bash
        run: |
          git diff --check
          git add lib/cognition/behavior-state.js lib/cognition/turn-stabilizer.js tests/rin-dialogue-guardrails.test.js
          if git diff --cached --quiet; then
            echo 'No changes: guardrails already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix Rin completed-topic carry and explicit no-question delivery'
          git push origin HEAD:main
      - name: Summary
        if: always()
        shell: bash
        run: |
          echo '## Rin dialogue guardrails' >> "$GITHUB_STEP_SUMMARY"
          echo 'Changes are committed only if targeted regression tests and npm run check succeed.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Scope: behavior-state.js, turn-stabilizer.js, one regression test file. No database, personality profile, voice or UI changes.' >> "$GITHUB_STEP_SUMMARY"
