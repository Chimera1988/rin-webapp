<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Вход — Рин</title>
  <link rel="stylesheet" href="/style.css?v=2026-08-08-dialogue-agency-v1" />
</head>
<body>
  <main class="login-screen">
    <h1>Добро пожаловать 🌸</h1>
    <form id="loginForm" novalidate>
      <input id="pinInput" type="password" inputmode="numeric" autocomplete="current-password" placeholder="Введите PIN" required />
      <button type="submit">Войти</button>
      <p id="loginError" class="login-error" role="alert" hidden></p>
    </form>
  </main>
  <script type="module" src="/js/login.js?v=2026-08-08-dialogue-agency-v1"></script>
</body>
</html>
